services:
  api:
    build: .
    container_name: first_project_api
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017

  mongo:
    image: mongo:7
    container_name: first_project_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
